[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monitoring-suite"
dynamic = ["version"]
description = "Consolidated domain packages: typed errors, security, API rate limiting, monitoring, retrieval provenance, and cross-cutting aspects"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "James Ekhator" }]
requires-python = ">=3.12"
optional-dependencies = { logging = ["logging-suite>=0.7.0"], sensitivity = ["logging-suite>=0.7.0"], cloudwatch = ["boto3>=1.28.0"], all = ["logging-suite>=0.7.0", "boto3>=1.28.0"] }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["domains", "errors", "security", "rate-limiting", "monitoring", "aspects"]

[project.urls]
Homepage = "https://pypi.org/project/monitoring-suite/"
Repository = "https://github.com/jekhator/monitoring-suite"
Issues = "https://github.com/jekhator/monitoring-suite/issues"
Changelog = "https://github.com/jekhator/monitoring-suite/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "monitoring_suite/errors/config/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["monitoring_suite"]
exclude = [
    "monitoring_suite/**/tests",
    "monitoring_suite/**/conftest.py",
    "monitoring_suite/errors/common/constants/tests.py"
]

[tool.pytest.ini_options]
testpaths = ["monitoring_suite"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["monitoring_suite"]
omit = ["monitoring_suite/**/tests/*", "monitoring_suite/errors/common/constants/tests.py", "monitoring_suite/aspects/conftest.py", "monitoring_suite/rag/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "TID252", "PLC0414", "UP035"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["monitoring_suite"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.strict-module]
paths = ["monitoring_suite/errors/", "monitoring_suite/security/", "monitoring_suite/api_limiter/", "monitoring_suite/monitoring/", "monitoring_suite/aspects/", "monitoring_suite/rag/"]
exception_tags = ["fixture"]

[tool.strict-module.loc-cap]
hard_cap = 300
soft_target = 200

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff", "httpx", "requests", "aiohttp", "botocore", "boto3", "logging-suite>=0.7.0"]

[tool.pyright]
venvPath = "."
venv = ".venv"
