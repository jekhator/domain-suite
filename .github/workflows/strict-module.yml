name: strict-module

# DTO-discipline lint (frozen+slots, facade-ban, R001-R006). Per-repo copy of
# the qhcg canonical gate; runs on the root-layout package. Empty baseline at
# v0.2.0 (clean rebuild — 0 violations).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Run strict-module
        run: |
          echo "=== strict-module: monitoring_suite.errors ===" && \
          uvx --python 3.12 --from strict-suite==0.4.0 strict-module monitoring_suite/errors/ --format github && \
          echo "=== strict-module: monitoring_suite.security ===" && \
          uvx --python 3.12 --from strict-suite==0.4.0 strict-module monitoring_suite/security/ --format github && \
          echo "=== strict-module: monitoring_suite.api_limiter ===" && \
          uvx --python 3.12 --from strict-suite==0.4.0 strict-module monitoring_suite/api_limiter/ --format github && \
          echo "=== strict-module: monitoring_suite.monitoring ===" && \
          uvx --python 3.12 --from strict-suite==0.4.0 strict-module monitoring_suite/monitoring/ --format github && \
          echo "=== strict-module: monitoring_suite.aspects ===" && \
          uvx --python 3.12 --from strict-suite==0.4.0 strict-module monitoring_suite/aspects/ --format github && \
          echo "=== strict-module: monitoring_suite.rag ===" && \
          uvx --python 3.12 --from strict-suite==0.4.0 strict-module monitoring_suite/rag/ --format github
      - name: Check LOC cap
        run: |
          for dir in monitoring_suite/errors monitoring_suite/security monitoring_suite/api_limiter monitoring_suite/monitoring monitoring_suite/aspects monitoring_suite/rag; do
            echo "=== loc-cap: $dir ===" && \
            uvx --python 3.12 --from strict-suite==0.4.0 strict-module loc-cap "$dir"
          done
