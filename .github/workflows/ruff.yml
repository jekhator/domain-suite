name: Ruff

# Ruff lint. Pinned to 0.15.14 to match local version.
# The format check is off: layout follows the grouped canon, which the formatter would undo.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.15.14 check .
